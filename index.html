<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corazón ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


// ============================
// CONFIGURACIÓN
// ============================

const N = 900;
const stars = [];


// ============================
// ECUACIÓN DEL CORAZÓN
// ============================

function heart(t) {

    return {
        x: 16 * Math.pow(Math.sin(t), 3),

        y: -(
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t)
        )
    };

}


// ============================
// CREAR PARTÍCULAS
// ============================

for (let i = 0; i < N; i++) {

    const angle = Math.random() * Math.PI * 2;

    const h = heart(angle);

    // posición inicial aleatoria
    const startX = Math.random() * W;
    const startY = Math.random() * H;

    // posición final del corazón
    const scale = Math.min(W, H) / 32;

    const targetX =
        W / 2 +
        h.x * scale +
        (Math.random() - 0.5) * 10;

    const targetY =
        H / 2 +
        h.y * scale +
        (Math.random() - 0.5) * 10;

    stars.push({

        x: startX,
        y: startY,

        tx: targetX,
        ty: targetY,

        size: Math.random() * 2.5 + 1,

        delay: Math.random() * 0.5

    });

}


// ============================
// ANIMACIÓN
// ============================

let startTime = performance.now();

function animate(time) {

    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, W, H);

    // tiempo desde que comenzó
    let elapsed = (time - startTime) / 1000;

    // formación durante 4 segundos
    let progress = Math.min(elapsed / 4, 1);


    for (const s of stars) {

        // retraso individual
        let p = Math.max(
            0,
            Math.min(1, (progress - s.delay) / 0.5)
        );

        // movimiento suave
        let ease = p * p * (3 - 2 * p);


        let x = s.x + (s.tx - s.x) * ease;
        let y = s.y + (s.ty - s.y) * ease;


        // pequeño latido después de formarse
        if (progress >= 1) {

            let beat =
                1 +
                Math.sin(elapsed * 3) * 0.025;

            x = W / 2 + (x - W / 2) * beat;
            y = H / 2 + (y - H / 2) * beat;
        }


        // brillo
        ctx.beginPath();

        ctx.fillStyle = "rgba(190, 80, 255, 0.9)";

        ctx.shadowBlur = 10;
        ctx.shadowColor = "violet";

        ctx.arc(
            x,
            y,
            s.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
